name: md2

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    profiles: [dev]
    env_file: .env
    ports:
      - "${PORT:?PORT must be set in the env file}:3000"
      - "${DEBUG_PORT:?DEBUG_PORT must be set in the env file}:9229"
    volumes:
      - ./src:/app/src:ro
      - ./themes:/app/themes:ro
      - ./tests:/app/tests:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - node_modules:/app/node_modules

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    profiles: [test]
    environment:
      NODE_ENV: test
      IN_DOCKER: "1"
      LOG_LEVEL: fatal
    volumes:
      - ./src:/app/src:ro
      - ./themes:/app/themes:ro
      - ./tests:/app/tests
      - ./tools:/app/tools:ro
      - node_modules_test:/app/node_modules

  prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    profiles: [prod]
    env_file: .env.prod
    environment:
      NODE_ENV: production
    ports:
      - "${PORT:?PORT must be set in the env file}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

volumes:
  node_modules:
  node_modules_test:
