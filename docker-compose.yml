name: md2

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      LOG_LEVEL: debug
      STRICT: "true"
      ENABLE_PREVIEW: "true"
      ENABLE_THEME_WATCH: "true"
      ENABLE_SWAGGER_UI: "true"
      THEMES_DIR: /app/themes
      ASSETS_DIR: /app/assets
    ports:
      - "3000:3000"
      - "9229:9229"
    volumes:
      - ./src:/app/src:ro
      - ./themes:/app/themes:ro
      - ./tests:/app/tests:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - node_modules:/app/node_modules

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      NODE_ENV: test
      IN_DOCKER: "1"
      LOG_LEVEL: fatal
    volumes:
      - ./src:/app/src:ro
      - ./themes:/app/themes:ro
      - ./tests:/app/tests
      - ./tools:/app/tools:ro
      - node_modules_test:/app/node_modules

  prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

volumes:
  node_modules:
  node_modules_test:
