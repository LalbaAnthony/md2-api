# ! This Apache2 file is NOT AUTOMATICALLY GENERATED or PUSHED IN PRODUCTION AUTOMATICALLY
# ! It is just a reference that NEEDS TO FIT THE EXACT SERVER CONFIGURATION to ensure reproductibility
# ! Required modules: a2enmod http2 ssl rewrite proxy proxy_http headers

<VirtualHost *:80>
    ServerName md2-api.dev-it.app

    # Certbot webroot - serve ACME challenge files directly, never redirect
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # Redirect everything else to HTTPS
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://md2-api.dev-it.app%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName md2-api.dev-it.app

    # HTTP/2 via ALPN - h2c is cleartext-only, keep it out of a TLS vhost
    Protocols h2 http/1.1
    ProtocolsHonorOrder On

    ProxyPreserveHost On

    # Node
    ProxyPass / http://127.0.0.1:4345/
    ProxyPassReverse / http://127.0.0.1:4345/

    # SSL configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/md2-api.dev-it.app/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/md2-api.dev-it.app/privkey.pem

    # TLS 1.2+ is mandatory for HTTP/2 ALPN negotiation
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder Off
    SSLSessionTickets Off

    # Security headers (also improves Lighthouse scores)
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(self)"

    # Log files
    ErrorLog ${APACHE_LOG_DIR}/md2-api_error.log
    CustomLog ${APACHE_LOG_DIR}/md2-api_access.log combined
</VirtualHost>
