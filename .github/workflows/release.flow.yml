name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: docker.io/lalbaanthony/md2-api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag the deployed image with the release version
        run: |
          COMMIT="$(git rev-parse HEAD)"
          SOURCE="${IMAGE}:sha-${COMMIT::7}"
          if ! docker buildx imagetools inspect "${SOURCE}" > /dev/null; then
            echo "::error::${SOURCE} does not exist. Only a commit built by the deploy workflow on main can be released."
            exit 1
          fi
          docker buildx imagetools create --tag "${IMAGE}:${GITHUB_REF_NAME}" "${SOURCE}"
