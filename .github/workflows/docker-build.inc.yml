name: docker-build

on:
  workflow_call:
    inputs:
      image-tag:
        description: Tag applied to the production image.
        required: false
        type: string
        default: md2:ci

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        run: docker build --file docker/Dockerfile --target prod --tag ${{ inputs.image-tag }} .
      - name: Start the production image
        run: >
          docker run --detach --name md2-ci
          --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges
          --publish 3000:3000 ${{ inputs.image-tag }}
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/readyz; then
              exit 0
            fi
            sleep 2
          done
          docker logs md2-ci
          exit 1
      - name: Stop the production image
        if: always()
        run: docker rm --force md2-ci
