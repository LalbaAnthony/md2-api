name: docker-build

on:
  workflow_call:
    inputs:
      image-tag:
        description: Tag applied to the production image.
        required: false
        type: string
        default: md2:ci
      push:
        description: Push the smoke tested image to the registry as latest and sha-<commit>.
        required: false
        type: boolean
        default: false
      image:
        description: Registry repository the image is pushed to.
        required: false
        type: string
        default: docker.io/lalbaanthony/md2-api

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        run: docker build --pull --file Dockerfile.prod --tag ${{ inputs.image-tag }} .
      - name: Start the production image
        run: >
          docker run --detach --name md2-ci
          --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges
          --publish 3000:3000 ${{ inputs.image-tag }}
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/readyz; then
              exit 0
            fi
            sleep 2
          done
          docker logs md2-ci
          exit 1
      - name: Stop the production image
        if: always()
        run: docker rm --force md2-ci
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the smoke tested image
        if: inputs.push
        env:
          LOCAL_TAG: ${{ inputs.image-tag }}
          IMAGE: ${{ inputs.image }}
        run: |
          SHA_TAG="${IMAGE}:sha-${GITHUB_SHA::7}"
          docker tag "${LOCAL_TAG}" "${SHA_TAG}"
          docker tag "${LOCAL_TAG}" "${IMAGE}:latest"
          docker push "${SHA_TAG}"
          docker push "${IMAGE}:latest"
