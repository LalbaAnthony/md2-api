name: ci

on:
  workflow_call:
    inputs:
      push:
        description: Push the smoke tested production image to the registry.
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.inc.yml
    with:
      node-version: "22"

  typecheck:
    needs: lint
    uses: ./.github/workflows/typecheck.inc.yml
    with:
      node-version: "22"

  unit:
    needs: typecheck
    uses: ./.github/workflows/unit.inc.yml
    with:
      node-version: "22"

  contract:
    needs: unit
    uses: ./.github/workflows/contract.inc.yml
    with:
      node-version: "22"

  golden:
    needs: contract
    uses: ./.github/workflows/golden.inc.yml
    with:
      node-version: "22"

  visual:
    needs: golden
    uses: ./.github/workflows/visual.inc.yml

  audit:
    needs: visual
    uses: ./.github/workflows/audit.inc.yml
    with:
      audit-level: high

  docker-build:
    needs: audit
    uses: ./.github/workflows/docker-build.inc.yml
    secrets: inherit
    with:
      image-tag: md2:ci
      push: ${{ inputs.push == true }}
