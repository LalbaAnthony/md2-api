name: typecheck

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used to run the compiler.
        required: false
        type: string
        default: "22"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
